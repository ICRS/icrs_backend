apiVersion: apps/v1
kind: Deployment
metadata:
  name: icrs-access-deployment
spec:
  replicas: 1  # Number of replicas you want to run
  selector:
    matchLabels:
      app: icrs-access
  template:
    metadata:
      labels:
        app: icrs-access
    spec:
      containers:
      - name: icrs-access
        image: icroboticssociety/icrs-server-router:1.0.0
        ports:
        - containerPort: 8000  # Port your Python application is listening on
        imagePullPolicy: "Always"
        volumeMounts:
          - name: postgres-ini 
            mountPath: /app/postgres.ini
            subPath: postgres.ini
            readOnly: true
        env:
        - name: TZ
          value: Europe/London
        - name: DATABASE_ADAPTER_IP
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: endpoint-url

      volumes:
        - name: postgres-ini 
          secret:
            secretName: postgres-ini-secret 


---
apiVersion: v1
kind: Service
metadata:
  name: icrs-access-service
spec:
  selector:
    app: icrs-access
  ports:
    - protocol: TCP
      port: 8000
      nodePort: 30001  # Change this to the desired external port
      targetPort: 8000
  type: NodePort
