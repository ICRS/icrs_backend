apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${printer-name}-printer-gateway-deployment
spec:
  replicas: 1 # Number of replicas you want to run
  selector:
    matchLabels:
      app: ${printer-name}-printer-gateway
  template:
    metadata:
      labels:
        app: ${printer-name}-printer-gateway
    spec:
      volumes:
      - name: rabbitmq-config
        secret:
          secretName: rabbitmq-secret
          items:
            - key: printer_rabbitmq.json
              path: rabbitmq.json
      - name: printer-gateway-storage
        persistentVolumeClaim:
          claimName: printer-gateway-pvc
      containers:
        - name: ${printer-name}-printer-gateway
          image: localhost:32000/icrs-bambu-printer-gateway:latest # Replace with your Python Docker image and tag
          ports:
            - containerPort: 8000 # Port your Python application is listening on
          imagePullPolicy: "Always"
          env:
            - name: TZ
              value: Europe/London
            - name: PRINTER_NAME
              value: ${printer-name}
            - name: HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: ${printer-name}-secret
                  key: hostname
            - name: ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: ${printer-name}-secret
                  key: access_code
            - name: PRINTER_SERIAL
              valueFrom:
                secretKeyRef:
                  name: ${printer-name}-secret
                  key: printer_serial
            - name: DATABASE_ADAPTER_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: endpoint-url
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: print-queue-default-user
                  key: host
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: print-queue-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: print-queue-default-user
                  key: password
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: print-queue-default-user
                  key: port

          volumeMounts:
            - name: printer-gateway-storage
              mountPath: "/app/videos/"
              subPath: ${printer-name}
            - name: rabbitmq-config
              mountPath: /app/rabbitmq.json
              subPath: rabbitmq.json

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: ${printer-name}-printer-gateway-service
spec:
  selector:
    app: ${printer-name}-printer-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: printer-gateway-pvc
spec:
  storageClassName: nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
