---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: grafana
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: grafana
  labels:
    app: grafana
  name: grafana
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
          env:
            - name: TZ
              value: Europe/London
            - name: GF_RENDERING_SERVER_URL
              value: http://grafana-renderer.grafana.svc.cluster.local:8081/render
            - name: GF_RENDERING_CALLBACK_URL
              value: http://grafana.grafana.svc.cluster.local:3000/
            - name: GF_LOG_FILTERS
              value: rendering:debug
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-pv
            - name: grafana-ini 
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
      volumes:
        - name: grafana-pv
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-ini 
          configMap:
            name: grafana-config 
            items:
              - key: grafana-ini
                path: grafana.ini
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: grafana
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: http-grafana
  selector:
    app: grafana
  sessionAffinity: None
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana-renderer
  name: grafana-renderer
  namespace: grafana
spec:
  selector:
    matchLabels:
      app: grafana-renderer
  template:
    metadata:
      labels:
        app: grafana-renderer
    spec:
      containers:
        - name: grafana-renderer
          image: grafana/grafana-image-renderer:latest
          ports:
            - containerPort: 8081
              name: http-renderer
              protocol: TCP
          env:
            - name: ENABLE_METRICS
              value: 'true'
          volumeMounts:
            - name: renderer-config 
              mountPath: /usr/src/app/config.json
              subPath: renderer_config.json
              readOnly: true
      volumes:
        - name: renderer-config 
          configMap:
            name: grafana-config 
            items:
              - key: renderer-config
                path: renderer_config.json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-renderer
  namespace: grafana
spec:
  selector:
    app: grafana-renderer
  ports:
    - port: 8081
      targetPort: http-renderer
  type: ClusterIP

