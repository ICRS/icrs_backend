apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress-controller
  namespace: ingress
spec:
  selector:
    matchLabels:
      app: nginx-ingress-controller
  template:
    metadata:
      labels:
        app: nginx-ingress-controller
    spec:
      containers:
        - name: nginx-ingress-controller
          image: icroboticssociety/nginx-ingress:latest
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-service
  namespace: ingress
spec:
  selector:
    app: nginx-ingress-controller
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
