apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-http-ingress
  namespace: ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-ingress-service
                port:
                  number: 80
