on:
  push:
    branches:
    - main
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Deploy to remote server
        run: |
          cd server
          ./docker_build.sh ${GITHUB_SHA}
          kubectl set image deployments/icrs-access-deployment icrs-access=localhost:32000/icrs-access:${GITHUB_SHA}
